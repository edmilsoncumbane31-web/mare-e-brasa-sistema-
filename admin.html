<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101b2d">
    <title>Painel Administrativo | Maré e Brasa</title>
    <link rel="stylesheet" href="admin.css">
    <script type="module" src="admin.js"></script>
</head>
<body>

    <header class="topo">
        <div>
            <h1>Maré e Brasa</h1>
            <p>Painel Administrativo</p>
        </div>
        <button id="btn-sair" hidden>Terminar sessão</button>
    </header>

    <main>
        <section id="login" class="painel">
            <h2>Acesso administrativo</h2>
            <p>Entre com a sua conta autorizada.</p>

            <form id="form-login">
                <label for="email">E-mail</label>
                <input type="email" id="email" required>

                <label for="senha">Palavra-passe</label>
                <input type="password" id="senha" required>

                <button type="submit">Entrar</button>
                <p id="mensagem-login"></p>
            </form>
        </section>

        <section id="dashboard" hidden>
            <h2>Visão geral</h2>
            <p id="boas-vindas"></p>

            <div class="resumo">
                <div class="cartao">
                    <span>Pedidos novos</span>
                    <strong id="pedidos-novos">0</strong>
                </div>

                <div class="cartao">
                    <span>Em preparação</span>
                    <strong id="pedidos-preparacao">0</strong>
                </div>

                <div class="cartao">
                    <span>Prontos</span>
                    <strong id="pedidos-prontos">0</strong>
                </div>
            </div>

            <section class="secao">
                <h2>Pedidos recentes</h2>
                <div id="lista-pedidos">
                    A carregar pedidos...
                </div>
            </section>
        </section>
    </main>

    <footer>
        Maré e Brasa · Gestão do Restaurante
    </footer>

</body>
</html>
